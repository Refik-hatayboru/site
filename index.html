<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sondaj Boruları</title>
<meta name="description" content="">
<meta name="theme-color" content="#1f2326">
<style>
:root{--accent:#f28c00;--accent-text:#f28c00;--on-accent:#111111;--bg:#1f2326;--surface:#2a2f33;--text:#eceff1;--muted:#aeb3b7;--line:#3d4348}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.65 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
body.adm-open{overflow:hidden}
img{max-width:100%;display:block}
a{color:inherit}
.wrap{width:100%;max-width:1080px;margin:0 auto;padding:0 18px}
.ico{width:20px;height:20px;flex:none}

/* ÜST ÇUBUK */
.top{position:sticky;top:0;z-index:40;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;min-height:64px;gap:12px;position:relative}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:800;font-size:1.02rem;letter-spacing:.03em;text-transform:uppercase;line-height:1.2}
.brand img{max-height:42px;width:auto}
.burger{background:none;border:2px solid var(--line);color:var(--text);width:48px;height:48px;border-radius:3px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.burger svg{width:24px;height:24px}
.nav{display:none;position:absolute;left:-18px;right:-18px;top:100%;background:var(--bg);border-bottom:4px solid var(--accent);flex-direction:column}
.nav.open{display:flex}
.nav a{padding:16px 18px;text-decoration:none;font-weight:700;border-top:1px solid var(--line)}
.nav a.on{color:var(--accent-text)}
@media(min-width:760px){
 .burger{display:none}
 .nav{display:flex;position:static;flex-direction:row;border:0;background:none;gap:2px}
 .nav a{border:0;padding:10px 14px}
}

/* DÜĞMELER */
.acts{display:flex;flex-wrap:wrap;gap:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 24px;border-radius:3px;font-weight:800;font-size:1rem;background:var(--accent);color:var(--on-accent);text-decoration:none;border:2px solid var(--accent);cursor:pointer;font-family:inherit}
.btn.ghost{background:transparent;color:var(--text);border-color:var(--line)}
.btn.sm{min-height:46px;padding:0 18px}

/* BÖLÜMLER */
.hero{background:var(--surface);border-bottom:5px solid var(--accent);padding:46px 0 42px}
.hero .tag{display:block;width:56px;height:6px;background:var(--accent);margin-bottom:20px}
.hero h1{margin:0 0 16px;font-size:clamp(1.9rem,7.5vw,3.2rem);line-height:1.12;font-weight:900;text-transform:uppercase;letter-spacing:.01em}
.hero p{margin:0 0 26px;max-width:640px;color:var(--muted);font-size:1.08rem}
.sec{padding:46px 0}
.sec.alt{background:var(--surface)}
.sec h2{margin:0 0 28px;font-size:1.45rem;text-transform:uppercase;letter-spacing:.04em;font-weight:800;padding-bottom:14px;position:relative}
.sec h2::after{content:"";position:absolute;left:0;bottom:0;width:48px;height:4px;background:var(--accent)}
.prose p{margin:0 0 1em;max-width:70ch}
.cards{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--accent);padding:18px;border-radius:3px}
.alt .card{background:var(--bg)}
.card h3{margin:0 0 6px;font-size:1.08rem}
.card p{margin:0;color:var(--muted);white-space:pre-line}
.price{margin-top:12px;font-weight:800;color:var(--accent-text)}
.card.q p{color:var(--text);font-style:italic}
.card.q cite{display:block;margin-top:12px;font-style:normal;font-weight:800}

/* GALERİ */
.grid{display:grid;gap:10px;grid-template-columns:repeat(2,1fr)}
@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:1000px){.grid{grid-template-columns:repeat(4,1fr)}}
.ph-btn{padding:0;border:0;background:var(--line);cursor:zoom-in;display:block;width:100%;aspect-ratio:4/3;overflow:hidden;border-radius:3px}
.ph-btn img{width:100%;height:100%;object-fit:cover}
.ph-empty{display:flex;align-items:center;justify-content:center;aspect-ratio:4/3;background:var(--line);color:var(--muted);font-size:.9rem;text-align:center;padding:10px;border-radius:3px}
.slider{position:relative}
.track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;border-radius:3px}
.track::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:center;aspect-ratio:4/3;background:var(--line)}
@media(min-width:760px){.slide{aspect-ratio:16/9}}
.slide .ph-btn{aspect-ratio:auto;height:100%;border-radius:0}
.sl-b{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:56px;border:0;background:var(--accent);color:var(--on-accent);font-size:1.7rem;font-weight:800;cursor:pointer;line-height:1}
.sl-prev{left:0}.sl-next{right:0}
.dots{display:flex;justify-content:center;gap:4px;margin-top:6px;flex-wrap:wrap}
.dots button{width:34px;height:34px;border:0;background:none;cursor:pointer;position:relative;padding:0}
.dots button::after{content:"";position:absolute;left:8px;right:8px;top:15px;height:4px;background:var(--line)}
.dots button.on::after{background:var(--accent)}

/* ÇALIŞMA SAATLERİ */
.hours{max-width:520px}
.hrow{display:flex;justify-content:space-between;gap:16px;padding:13px 0;border-bottom:1px solid var(--line)}
.hrow b{font-weight:700}
.hrow span{color:var(--muted);text-align:right}

/* KONUMLAR */
.locs{display:grid;gap:26px}
@media(min-width:900px){.locs.two{grid-template-columns:1fr 1fr}}
.loc h3{margin:0 0 4px;font-size:1.15rem}
.loc .addr{margin:0 0 12px;color:var(--muted)}
.map{width:100%;height:260px;border:0;background:var(--line);margin-bottom:12px;border-radius:3px;display:block}

/* İLETİŞİM */
.clist{display:grid;gap:12px;max-width:600px}
.crow{display:flex;align-items:center;gap:14px;padding:14px 16px;min-height:64px;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:3px;text-decoration:none}
.alt .crow{background:var(--bg)}
.crow .ico{width:26px;height:26px;color:var(--accent-text)}
.crow small{display:block;color:var(--muted);font-size:.8rem;text-transform:uppercase;letter-spacing:.05em}
.crow strong{font-size:1.08rem;word-break:break-word}

/* ALT BİLGİ */
footer{padding:30px 0 34px;border-top:1px solid var(--line);color:var(--muted);font-size:.9rem}
.adm-link{display:inline-block;margin-top:12px;font-size:.75rem;opacity:.65;text-decoration:underline}

/* TELEFONDA ALTTA SABİT ARA / WHATSAPP ÇUBUĞU */
.mbar{position:fixed;left:0;right:0;bottom:0;display:flex;gap:2px;background:var(--bg);z-index:30;border-top:3px solid var(--accent)}
.mbar a{flex:1;display:flex;align-items:center;justify-content:center;gap:10px;min-height:56px;font-weight:800;text-decoration:none;background:var(--accent);color:var(--on-accent)}
.mbar a.wa{background:var(--surface);color:var(--text)}
body.has-mbar{padding-bottom:62px}
@media(min-width:760px){.mbar{display:none}body.has-mbar{padding-bottom:0}}

/* BÜYÜK FOTOĞRAF */
#lightbox{position:fixed;inset:0;background:rgba(0,0,0,.93);z-index:100;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:56px 10px 40px}
#lightbox[hidden]{display:none}
#lightbox img{max-width:100%;max-height:100%;object-fit:contain}
#lightbox button{position:absolute;border:0;background:var(--accent);color:var(--on-accent);font-weight:800;cursor:pointer;width:52px;height:52px;font-size:1.7rem;line-height:1}
.lb-x{top:0;right:0}.lb-p{left:0;top:50%;margin-top:-26px}.lb-n{right:0;top:50%;margin-top:-26px}
.lb-cap{position:absolute;left:0;right:0;bottom:8px;text-align:center;color:#ddd;font-size:.9rem;padding:0 60px}

.center-msg{padding:80px 20px;text-align:center;color:var(--muted)}
.center-msg a{color:var(--accent-text)}

/* ================= YÖNETİCİ PANELİ (site temasından bağımsız) ================= */
#admin{position:fixed;inset:0;overflow:auto;background:#eef0f1;color:#1d2125;z-index:60;font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
#admin[hidden]{display:none}
#admin *{box-sizing:border-box}
.a-top{position:sticky;top:0;height:64px;background:#23272b;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 12px;gap:8px;z-index:4}
.a-top b{font-size:1.02rem}
.a-link{color:#fff;text-decoration:none;padding:0 14px;border:1px solid #666;border-radius:6px;background:none;font:inherit;cursor:pointer;min-height:44px;display:inline-flex;align-items:center}
.a-nav{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;background:#fff;border-bottom:1px solid #d5d9dc;position:sticky;top:64px;z-index:3}
.a-nav button{flex:none;min-height:48px;padding:0 16px;border:2px solid #d5d9dc;background:#fff;border-radius:6px;font:inherit;font-weight:700;cursor:pointer;color:#1d2125}
.a-nav button.on{background:#23272b;border-color:#23272b;color:#fff}
.a-main{max-width:820px;margin:0 auto;padding:18px 14px 150px}
.a-main h2{margin:4px 0 6px;font-size:1.45rem}
.a-main h3{margin:0 0 12px;font-size:1.08rem}
.a-help{margin:0 0 16px;color:#4a545b}
.a-card{background:#fff;border:1px solid #d5d9dc;border-radius:8px;padding:16px;margin-bottom:16px}
.fld{display:block;margin-bottom:14px}
.fld>span{display:block;font-weight:700;margin-bottom:6px}
.fld input,.fld textarea,.fld select{width:100%;padding:12px;border:2px solid #c3c9cd;border-radius:6px;font:inherit;background:#fff;color:#1d2125;min-height:48px}
.fld input[type=color]{padding:4px;height:56px}
.fld textarea{resize:vertical}
.fld small{display:block;color:#5d676e;margin-top:5px}
.chk{display:flex;align-items:center;gap:12px;min-height:48px;font-weight:600;cursor:pointer}
.chk input{width:26px;height:26px;flex:none}
.a-btn{min-height:48px;padding:0 18px;border-radius:6px;border:2px solid #23272b;background:#fff;color:#23272b;font:inherit;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.a-btn.pri{background:#f28c00;border-color:#f28c00;color:#111}
.a-btn.dng{border-color:#b3261e;color:#b3261e}
.a-btn.big{min-height:58px;font-size:1.08rem;padding:0 26px}
.a-btn[disabled]{opacity:.55;cursor:wait}
.a-save{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:4px solid #f28c00;padding:10px 14px;display:flex;gap:12px;align-items:center;justify-content:space-between;z-index:5}
.a-save span{font-weight:700}
.a-save span.dirty{color:#b3261e}
.a-save span.ok{color:#1b6e2d}
.a-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.item{border:1px solid #d5d9dc;border-radius:8px;padding:14px;margin-bottom:12px;background:#fafbfb}
.ph{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.ph img{width:110px;height:82px;object-fit:cover;border-radius:4px;background:#ddd}
.ph .fld{flex:1;min-width:180px;margin:0}
.opt{display:flex;gap:12px;align-items:center;min-height:52px;padding:10px 14px;border:2px solid #d5d9dc;border-radius:8px;margin-bottom:10px;cursor:pointer;font-weight:600;background:#fff}
.opt input{width:24px;height:24px;flex:none}
.opt small{display:block;font-weight:400;color:#5d676e}
.sw{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-bottom:14px}
.swb{display:flex;align-items:center;gap:10px;min-height:56px;padding:8px 12px;border:3px solid #d5d9dc;border-radius:8px;background:#fff;font:inherit;font-weight:700;cursor:pointer;text-align:left;color:#1d2125}
.swb.on{border-color:#23272b;background:#f1f3f4}
.swb i{width:26px;height:26px;border-radius:50%;border:1px solid #888;flex:none}
.msg{margin:10px 0 0;font-weight:700}
.msg.err{color:#b3261e}.msg.ok{color:#1b6e2d}
.a-login{max-width:420px;margin:0 auto;padding:40px 16px}
.a-login form{background:#fff;border:1px solid #d5d9dc;border-radius:10px;padding:22px}
.a-login h1{margin:0 0 16px;font-size:1.4rem}
.a-login .a-btn{width:100%}
.a-login a{display:inline-block;margin-top:14px}
.steps li{margin-bottom:8px}
</style>
</head>

 <img alt="">

 <div class="lb-cap"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
'use strict';

/* ==========================================================================
   AYARLAR  —  Kurulum 2. adımında bu iki satırı kendi bilgilerinizle değiştireceksiniz.
   (Bu anahtar herkese açık olması için tasarlanmıştır; gizli şifre DEĞİLDİR.
    Değişiklik yetkisi sunucudaki güvenlik kurallarıyla sadece sizdedir.)
   ========================================================================== */
const SUPABASE_URL = 'https://okyfkgynmiwylqofwmsj.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_8fltUwXP9Qfc6kpRZkQxtA_tLfGUsvH';
/* ========================================================================== */

const BUCKET = 'site-dosyalari';
const CACHE_KEY = 'sondaj_site_cache_v1';
const configured = /^https:\/\/.+/.test(SUPABASE_URL) && !/^BURAYA/.test(SUPABASE_ANON_KEY);
let sb = null;
try { if (configured && window.supabase) sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY); } catch (e) { console.warn(e); }

let S = null;          // sitede görünen (kaydedilmiş) ayarlar
let loadError = false; // veritabanından okunamadıysa

/* ---------- yardımcılar ---------- */
const $ = (s, r) => (r || document).querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Math.random().toString(36).slice(2, 9);
const clone = o => JSON.parse(JSON.stringify(o));
const getPath = (o, p) => p.split('.').reduce((a, k) => (a == null ? a : a[k]), o);
const setPath = (o, p, v) => { const k = p.split('.'); let c = o; for (let i = 0; i < k.length - 1; i++) c = c[k[i]]; c[k[k.length - 1]] = v; };
const slugify = t => String(t).replace(/İ/g, 'i').toLowerCase().replace(/ç/g, 'c').replace(/ğ/g, 'g').replace(/ı/g, 'i').replace(/ö/g, 'o').replace(/ş/g, 's').replace(/ü/g, 'u').replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'sayfa';
const uniqueSlug = (base, used) => { let s = slugify(base), n = 2, t = s; while (used.has(t) || t === 'yonetici') t = s + '-' + n++; return t; };

/* ---------- renk işlemleri ---------- */
const isHex = h => /^#[0-9a-f]{6}$/i.test(h || '');
const hex2rgb = h => { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; };
const rgb2hex = a => '#' + a.map(v => Math.round(v).toString(16).padStart(2, '0')).join('');
const mix = (a, b, t) => { const A = hex2rgb(a), B = hex2rgb(b); return rgb2hex(A.map((v, i) => v * t + B[i] * (1 - t))); };
const lum = h => { const [r, g, b] = hex2rgb(h).map(v => { v /= 255; return v <= .03928 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4); }); return .2126 * r + .7152 * g + .0722 * b; };
const contrast = (a, b) => { const x = lum(a), y = lum(b); return (Math.max(x, y) + .05) / (Math.min(x, y) + .05); };

/* ---------- hazır temalar (mor / mavi-mor yok) ---------- */
const THEMES = {
  turuncu: { name: 'Antrasit + Turuncu', accent: '#f28c00', dark: { bg: '#1f2326', surface: '#2a2f33', text: '#eceff1' }, light: { bg: '#f1f2f3', surface: '#ffffff', text: '#1f2326' } },
  sari:    { name: 'Antrasit + Sarı',    accent: '#f5c400', dark: { bg: '#1f2326', surface: '#2a2f33', text: '#eceff1' }, light: { bg: '#f1f2f3', surface: '#ffffff', text: '#1f2326' } },
  kirmizi: { name: 'Çelik Gri + Kırmızı', accent: '#d9381e', dark: { bg: '#23272b', surface: '#2e3338', text: '#eef0f1' }, light: { bg: '#eceeef', surface: '#ffffff', text: '#23272b' } },
  yesil:   { name: 'Koyu Gri + Yeşil',   accent: '#7fb02b', dark: { bg: '#202420', surface: '#2b302b', text: '#eef1ee' }, light: { bg: '#f0f2ee', surface: '#ffffff', text: '#202420' } }
};
function themeColors(t) {
  const p = THEMES[t.preset] || THEMES.turuncu;
  let c = t.custom ? { accent: t.accent, bg: t.bg, surface: t.surface, text: t.text }
                   : Object.assign({ accent: p.accent }, p[t.mode === 'light' ? 'light' : 'dark']);
  const d = THEMES.turuncu.dark;
  if (!isHex(c.accent)) c.accent = THEMES.turuncu.accent;
  if (!isHex(c.bg)) c.bg = d.bg;
  if (!isHex(c.surface)) c.surface = d.surface;
  if (!isHex(c.text)) c.text = d.text;
  c.muted = mix(c.text, c.bg, .68);
  c.line = mix(c.text, c.bg, .2);
  c.onAccent = lum(c.accent) > .4 ? '#111111' : '#ffffff';
  c.accentText = contrast(c.accent, c.bg) >= 3 ? c.accent : mix(c.text, c.accent, .75);
  return c;
}
function applyTheme(s) {
  const c = themeColors(s.theme), r = document.documentElement.style;
  r.setProperty('--accent', c.accent); r.setProperty('--accent-text', c.accentText); r.setProperty('--on-accent', c.onAccent);
  r.setProperty('--bg', c.bg); r.setProperty('--surface', c.surface); r.setProperty('--text', c.text);
  r.setProperty('--muted', c.muted); r.setProperty('--line', c.line);
  const m = document.querySelector('meta[name=theme-color]'); if (m) m.content = c.bg;
}

/* ---------- varsayılan (örnek) içerik ---------- */
const DEFAULT_SHOW = { hero: true, body: true, products: true, gallery: true, hours: true, testimonials: true, locations: true, contact: true };
const PAGE_BASE = { id: '', slug: '', title: 'Sayfa', menu: true, heroTitle: '', heroText: '', bodyTitle: '', body: '' };
function defaults() {
  return {
    v: 1,
    company: {
      name: 'Örnek Sondaj Boruları Ltd.',
      description: 'Sondaj borusu satışı. Ürün bilgisi ve fiyat için bizi arayın.',
      footer: '© Örnek Sondaj Boruları Ltd. Tüm hakları saklıdır.'
    },
    logoUrl: '', logoPath: '',
    theme: { preset: 'turuncu', mode: 'dark', custom: false, accent: '#f28c00', bg: '#1f2326', surface: '#2a2f33', text: '#eceff1' },
    gallery: { enabled: true, title: 'Galeri', mode: 'grid' },
    photos: [],
    pages: [{
      id: 'ana', slug: 'ana-sayfa', title: 'Ana Sayfa', menu: true,
      heroTitle: 'Sondaj Boruları',
      heroText: 'Bu bir örnek yazıdır. Yönetici panelinden "Yazılar" bölümüne girip kendi tanıtım cümlenizi yazabilirsiniz.',
      bodyTitle: 'Hakkımızda',
      body: 'Bu alan örnek metindir. Firmanızı, sunduğunuz ürünleri ve hizmetleri burada anlatabilirsiniz.\n\nYeni bir paragraf için bir satır boş bırakın.',
      show: Object.assign({}, DEFAULT_SHOW)
    }],
    products: {
      enabled: true, title: 'Ürünlerimiz', showPrice: true,
      items: [
        { id: 'u1', name: 'Örnek Ürün 1', desc: 'Ürün açıklamasını panelden yazın.', price: 'Fiyat için arayın' },
        { id: 'u2', name: 'Örnek Ürün 2', desc: 'Ürün açıklamasını panelden yazın.', price: 'Fiyat için arayın' },
        { id: 'u3', name: 'Örnek Ürün 3', desc: 'Ürün açıklamasını panelden yazın.', price: 'Fiyat için arayın' }
      ]
    },
    hours: {
      enabled: true, title: 'Çalışma Saatleri',
      items: [{ day: 'Pazartesi - Cuma', time: '08:30 - 18:00' }, { day: 'Cumartesi', time: '09:00 - 14:00' }, { day: 'Pazar', time: 'Kapalı' }]
    },
    testimonials: {
      enabled: false, title: 'Müşteri Yorumları',
      items: [{ id: 't1', name: 'Örnek Müşteri', text: 'Bu örnek bir yorumdur. Gerçek müşteri yorumlarını panelden ekleyin.' }]

function merge(def, src) {
  if (Array.isArray(def)) return Array.isArray(src) ? src : def;
  if (def && typeof def === 'object') {
    const o = {}, has = src && typeof src === 'object' && !Array.isArray(src);
    for (const k of Object.keys(def)) o[k] = merge(def[k], has ? src[k] : undefined);
    if (has) for (const k of Object.keys(src)) if (!(k in o)) o[k] = src[k];
    return o;
  }
  return src === undefined || src === null ? def : src;
}
function normalize(raw) {
  const s = merge(defaults(), raw || {});
  if (!Array.isArray(s.pages) || !s.pages.length) s.pages = defaults().pages;
  const used = new Set();
  s.pages = s.pages.map(p => {
    p = Object.assign({}, PAGE_BASE, p);
    p.show = Object.assign({}, DEFAULT_SHOW, p.show || {});
    p.id = p.id || uid();
    if (!p.slug || used.has(p.slug) || p.slug === 'yonetici') p.slug = uniqueSlug(p.title, used);
    used.add(p.slug);
    return p;
  });
  ['products', 'testimonials', 'locations', 'contacts'].forEach(k => s[k].items.forEach(i => { if (!i.id) i.id = uid(); }));

}

function galleryHTML() {

      '</div><button type="button" class="sl-b sl-prev" aria-label="Önceki">&lsaquo;</button><button type="button" class="sl-b sl-next" aria-label="Sonraki">&rsaquo;</button><div class="dots"></div></div>';
  }

function initSliders() {
  document.querySelectorAll('[data-slider]').forEach(el => {
    const tr = $('.track', el), dots = $('.dots', el), n = tr.children.length;
    dots.innerHTML = Array.from({ length: n }, (_, i) => '<button type="button" data-d="' + i + '" aria-label="Fotoğraf ' + (i + 1) + '"></button>').join('');
    const upd = () => { const i = Math.round(tr.scrollLeft / (tr.clientWidth || 1)); Array.from(dots.children).forEach((d, k) => d.classList.toggle('on', k === i)); };
    tr.addEventListener('scroll', () => requestAnimationFrame(upd));
    $('.sl-prev', el).onclick = () => tr.scrollBy({ left: -tr.clientWidth, behavior: 'smooth' });
    $('.sl-next', el).onclick = () => tr.scrollBy({ left: tr.clientWidth, behavior: 'smooth' });
    dots.onclick = e => { const b = e.target.closest('[data-d]'); if (b) tr.scrollTo({ left: +b.dataset.d * tr.clientWidth, behavior: 'smooth' }); };
    upd();
  });
}

const currentSlug = () => { try { return decodeURIComponent(location.hash.replace(/^#\/?/, '')); } catch (e) { return ''; } };
function route(keepScroll) {
  const h = currentSlug();
  if (h === 'yonetici') { showAdmin(); return; }
  $('#admin').hidden = true; $('#site').hidden = false; document.body.classList.remove('adm-open');
  if (!S) { renderStatus(); return; }
  renderSite(S.pages.find(p => p.slug === h) || S.pages[0]);
  if (!keepScroll) window.scrollTo(0, 0);
}
function renderStatus() {
  $('#site').innerHTML = loadError
    ? '<div class="center-msg">Site içeriği şu anda yüklenemedi. Lütfen birkaç dakika sonra tekrar deneyin.<br><br><a href="#/yonetici">Yönetici</a></div>'
    : '<div class="center-msg">Yükleniyor…</div>';
}
window.addEventListener('hashchange', () => route());

const readCache = () => { try { return JSON.parse(localStorage.getItem(CACHE_KEY)); } catch (e) { return null; } };
const writeCache = v => { try { localStorage.setItem(CACHE_KEY, JSON.stringify(v)); } catch (e) { /* önemli değil */ } };
function withTimeout(p, ms) { return Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error('zaman aşımı')), ms))]); }

async function init() {
  if (!configured) { S = normalize(null); route(); return; }
  const cached = readCache();
  if (cached) { S = normalize(cached); applyTheme(S); } else renderStatus();
  route();
  try {
    if (!sb) throw new Error('Supabase yüklenemedi');
    const { data, error } = await withTimeout(sb.from('site_data').select('value').eq('key', 'settings').maybeSingle(), 9000);
    if (error) throw error;
    const fresh = normalize(data ? data.value : null);
    const changed = JSON.stringify(fresh) !== JSON.stringify(S);
    S = fresh; loadError = false; writeCache(data ? data.value : null);
    if (changed || !cached) route(true);
  } catch (e) {
    console.warn('Veri okunamadı:', e);
    if (!S) { loadError = true; route(); }
  }
}

function afterChange(path, v, old) {
  if (path.startsWith('theme.')) {
    if (path === 'theme.custom') {
      if (v) { const c = themeColors(Object.assign({}, adm.draft.theme, { custom: false })); Object.assign(adm.draft.theme, { accent: c.accent, bg: c.bg, surface: c.surface, text: c.text }); }
      renderTab();
    } else renderPreview();
    return;
  }
  if (/^pages\.\d+\.title$/.test(path)) {
    const idx = +path.split('.')[1], used = new Set(adm.draft.pages.filter((_, k) => k !== idx).map(p => p.slug));
    adm.draft.pages[idx].slug = uniqueSlug(v || 'sayfa', used);
    return;
  }
  if (/^contacts\.items\.\d+\.type$/.test(path)) {
    const it = getPath(adm.draft, path.replace(/\.type$/, '')), oldName = (CONTACT_TYPES[old] || {}).name;
    if (!it.label || it.label === oldName) it.label = CONTACT_TYPES[v].name;
    renderTab();
  }
}
function onField(e) {
  const t = e.target, path = t.dataset && t.dataset.bind;
  if (t.id === 'pgsel' && e.type === 'change') { adm.pageIdx = +t.value; renderTab(); return; }
  if (!path || !adm.draft) return;
  const discrete = t.type === 'checkbox' || t.type === 'radio' || t.tagName === 'SELECT';
  if (e.type === 'input' && discrete) return;
  if (e.type === 'change' && !discrete) return;
  if (t.type === 'radio' && !t.checked) return;
  const v = t.type === 'checkbox' ? t.checked : t.value;
  const old = getPath(adm.draft, path);
  setPath(adm.draft, path, v); markDirty(); afterChange(path, v, old);
}

/* ---------- fotoğraf yükleme ---------- */
function prepareImage(file, max, keepPng) {
  return new Promise((res, rej) => {
    if (file.type === 'image/svg+xml' && keepPng) return res(file);
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      URL.revokeObjectURL(url);
      const sc = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const w = Math.max(1, Math.round(img.naturalWidth * sc)), h = Math.max(1, Math.round(img.naturalHeight * sc));
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      const x = c.getContext('2d'), png = keepPng && file.type === 'image/png';
      if (!png) { x.fillStyle = '#ffffff'; x.fillRect(0, 0, w, h); }
      x.drawImage(img, 0, 0, w, h);
      c.toBlob(b => b ? res(b) : rej(new Error('Görsel işlenemedi')), png ? 'image/png' : 'image/jpeg', .85);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('Bu dosya görsel olarak açılamadı: ' + file.name)); };
    img.src = url;
  });
}
async function uploadImage(file, folder, max, keepPng) {
  const blob = await prepareImage(file, max, keepPng);
  const ext = blob.type === 'image/png' ? 'png' : blob.type === 'image/svg+xml' ? 'svg' : 'jpg';
  const path = folder + '/' + Date.now() + '-' + uid() + '.' + ext;
  const { error } = await sb.storage.from(BUCKET).upload(path, blob, { contentType: blob.type, cacheControl: '31536000', upsert: false });
  if (error) throw error;
  return { path, url: sb.storage.from(BUCKET).getPublicUrl(path).data.publicUrl };
}
const setMsg = (id, text, cls) => { const m = document.getElementById(id); if (m) { m.textContent = text; m.className = 'msg ' + (cls || ''); } };
const friendly = e => {
  const m = String((e && e.message) || e);
  if (/row-level security|policy|not authorized|permission|JWT/i.test(m)) return 'Yetki hatası: giriş yaptığınız e-posta, kurulum.sql dosyasına yazdığınız yönetici e-postasıyla aynı olmalı.';
  if (/bucket/i.test(m) && /not found/i.test(m)) return 'Depolama alanı bulunamadı: kurulum.sql dosyasını çalıştırdığınızdan emin olun.';
  return m;
};

async function handleUpload(input) {
  const files = Array.from(input.files || []); input.value = '';
  if (!files.length) return;
  let ok = 0;
  for (let i = 0; i < files.length; i++) {
    setMsg('upmsg', 'Yükleniyor (' + (i + 1) + '/' + files.length + ')…');
    try { const r = await uploadImage(files[i], 'galeri', 1600, false); adm.draft.photos.push({ path: r.path, url: r.url, caption: '' }); ok++; }
    catch (e) { setMsg('upmsg', 'Hata: ' + friendly(e), 'err'); if (ok) markDirty(); renderTabKeepMsg(); return; }
  }
  markDirty(); adm.tab = 'foto'; renderTab(); setMsg('upmsg', ok + ' fotoğraf yüklendi. Siteye yansıması için KAYDET’e basın.', 'ok');
}
function renderTabKeepMsg() { const t = $('#upmsg') ? $('#upmsg').textContent : ''; renderTab(); setMsg('upmsg', t, 'err'); }
async function handleLogo(input) {
  const file = input.files && input.files[0]; input.value = ''; if (!file) return;

}

async function saveAll() {
  const btn = $('#a-savebtn'); if (!btn || btn.disabled) return;
  btn.disabled = true; const s = $('#a-state'); s.textContent = 'Kaydediliyor…'; s.className = '';
  try {
    const payload = normalize(clone(adm.draft));
    const { error } = await sb.from('site_data').upsert({ key: 'settings', value: payload, updated_at: new Date().toISOString() });
    if (error) throw error;
    S = payload; adm.draft = clone(payload); writeCache(payload); loadError = false;
    const del = adm.pending.filter(Boolean); adm.pending = [];
    if (del.length) { try { await sb.storage.from(BUCKET).remove(del); } catch (e) { console.warn(e); } }
    adm.dirty = false; renderTab(); updateDirty();
  } catch (e) {
    s.textContent = 'KAYDEDİLEMEDİ: ' + friendly(e); s.className = 'dirty';
  }
  btn.disabled = false;
}

async function onClick(e) {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, list = b.dataset.list, i = +b.dataset.i, d = adm.draft;
  if (act === 'tab') { adm.tab = b.dataset.k; renderTab(); $('#admin').scrollTop = 0; return; }
  if (act === 'save') return saveAll();
  if (act === 'retry') return startDraft();
  if (act === 'logout') {

    try { await sb.auth.signOut(); } catch (er) { /* önemli değil */ }
    adm.session = null; adm.draft = null; adm.dirty = false; adm.pending = []; renderAdmin(); return;
  }
  if (act === 'preset') { d.theme.preset = b.dataset.k; d.theme.custom = false; markDirty(); renderTab(); return; }
  if (act === 'dellogo') { if (d.logoPath) adm.pending.push(d.logoPath); d.logoPath = ''; d.logoUrl = ''; markDirty(); renderTab(); return; }
  if (act === 'chpass') {

  }
  if (!list) return;
  const arr = getPath(d, list);
  if (act === 'add') {
    if (list === 'pages') {
      const used = new Set(arr.map(p => p.slug));
      const p = Object.assign({}, PAGE_BASE, { id: uid(), title: 'Yeni Sayfa', heroTitle: 'Yeni Sayfa', show: Object.assign({}, DEFAULT_SHOW, { products: false, gallery: false, hours: false, testimonials: false, locations: false, contact: false }) });
      p.slug = uniqueSlug(p.title, used); arr.push(p); adm.pageIdx = arr.length - 1;
    } else arr.push(NEW_ITEM[list]());
  } else if (act === 'up' || act === 'down') {
    const j = act === 'up' ? i - 1 : i + 1; if (j < 0 || j >= arr.length) return;
    const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
  } else if (act === 'del') {
    if (list === 'pages' && arr.length <= 1) return alert('En az bir sayfa kalmalı.');
    if (!confirm(list === 'photos' ? 'Bu fotoğraf silinsin mi?' : list === 'pages' ? 'Bu sayfa silinsin mi?' : 'Bu satır silinsin mi?')) return;
    const [x] = arr.splice(i, 1);
    if (list === 'photos' && x.path) adm.pending.push(x.path);
    if (list === 'pages') adm.pageIdx = 0;
  }
  markDirty(); renderTab();
}

/* ---------- bağlama ---------- */
const adminRoot = $('#admin');
adminRoot.addEventListener('input', onField);
adminRoot.addEventListener('change', e => {
  if (e.target.id === 'ph-file') return handleUpload(e.target);
  if (e.target.id === 'logo-file') return handleLogo(e.target);
  onField(e);
});
adminRoot.addEventListener('click', onClick);
adminRoot.addEventListener('submit', async e => {
  e.preventDefault();
  if (e.target.id !== 'loginForm') return;
  const em = e.target.elements.email.value.trim(), pw = e.target.elements.password.value;
  setMsg('loginMsg', 'Giriş yapılıyor…');
  try {
    const { data, error } = await sb.auth.signInWithPassword({ email: em, password: pw });
    if (error) throw error;
    adm.session = data.session; adm.draft = null; renderAdmin();
  } catch (er) { setMsg('loginMsg', /invalid|credentials/i.test(er.message) ? 'E-posta veya şifre hatalı.' : 'Hata: ' + er.message, 'err'); }
});

if (sb) {
  sb.auth.getSession().then(r => { adm.session = r.data.session; adm.checked = true; if (currentSlug() === 'yonetici') renderAdmin(); })
    .catch(() => { adm.checked = true; if (currentSlug() === 'yonetici') renderAdmin(); });
  sb.auth.onAuthStateChange((_ev, session) => {
    const had = !!adm.session; adm.session = session;
    if (had !== !!session && currentSlug() === 'yonetici') { adm.draft = null; renderAdmin(); }
  });
}

init();
})();
</script>
</body>
